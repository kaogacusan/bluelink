<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Welcome to Atenean Networking. Find work, a mentor, or a teammate. Members only, for Ateneans 18 and older. Not an official Ateneo service." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>BlueLink</title>
    <script>
      try {
        var t = localStorage.getItem('bl:ui-theme')
        if (t) document.documentElement.dataset.theme = JSON.parse(t)
        // The splash matches the first screen: the dark landing, or the app in its theme.
        var signedIn = JSON.parse(localStorage.getItem('bl:token') || 'null')
        var legal = /^#\/(privacy|terms)/.test(location.hash)
        document.documentElement.dataset.splash = signedIn || legal ? document.documentElement.dataset.theme : 'void'
      } catch (e) {}
    </script>
    <style>
      #splash {
        --bg: #03050d;
        --back: #93a8ff;
        --front: #ffffff;
        --track: rgba(147, 168, 255, 0.16);
        --glint: #3a5fff;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--bg);
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s 0.4s;
      }
      [data-splash='dark'] #splash {
        --bg: #04060f;
      }
      [data-splash='light'] #splash {
        --bg: #f4f5f9;
        --front: #1d45e5;
        --track: rgba(10, 21, 64, 0.08);
        --glint: #ffffff;
      }
      #splash svg {
        width: 60px;
        height: 60px;
        overflow: visible;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash.out svg {
        transform: scale(1.08);
      }
      /* Each link is 17 x 12 with 6 radius: its outline is about 48 units long. */
      #splash rect {
        fill: none;
        stroke-width: 4;
        stroke-dasharray: 48;
        stroke-dashoffset: 48;
        animation: bl-draw 0.6s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      #splash .track {
        stroke: var(--track);
        stroke-dashoffset: 0;
        animation: none;
      }
      #splash .a {
        stroke: var(--back);
        animation-delay: 0.05s;
      }
      #splash .b {
        stroke: var(--front);
        animation-delay: 0.2s;
      }
      /* While the app still loads, a small light runs along the links. */
      #splash .glint {
        stroke: var(--glint);
        stroke-dasharray: 6 42;
        opacity: 0;
        animation: bl-glint 1.4s linear 0.9s infinite;
      }
      @keyframes bl-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes bl-glint {
        from {
          stroke-dashoffset: 48;
          opacity: 1;
        }
        to {
          stroke-dashoffset: 0;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash rect {
          animation: none;
          stroke-dashoffset: 0;
        }
        #splash .glint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <defs>
          <clipPath id="bl-splash-clip"><circle cx="20" cy="13" r="4.2" /></clipPath>
        </defs>
        <rect class="track" x="3" y="7" width="17" height="12" rx="6" />
        <rect class="track" x="12" y="13" width="17" height="12" rx="6" />
        <rect class="a" x="3" y="7" width="17" height="12" rx="6" />
        <rect class="glint" x="3" y="7" width="17" height="12" rx="6" />
        <rect class="b" x="12" y="13" width="17" height="12" rx="6" />
        <rect class="glint" x="12" y="13" width="17" height="12" rx="6" />
        <!-- The back link passes over the front link at the top right. -->
        <rect class="a" x="3" y="7" width="17" height="12" rx="6" clip-path="url(#bl-splash-clip)" />
      </svg>
    </div>
    <div id="root"></div>
    <script>
      // Hide the splash when the first real screen is up, but not before the logo is drawn.
      ;(function () {
        var splash = document.getElementById('splash')
        var root = document.getElementById('root')
        var minMs = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 900
        var done = false
        var watch = new MutationObserver(function () {
          // The boot screen waits for the account. Its error text means it is done.
          if (root.firstElementChild && (!root.querySelector('.boot') || root.querySelector('.boot p'))) hide()
        })
        function hide() {
          if (done) return
          done = true
          watch.disconnect()
          setTimeout(function () {
            splash.classList.add('out')
            setTimeout(function () { splash.remove() }, 450)
          }, Math.max(0, minMs - performance.now()))
        }
        watch.observe(root, { childList: true, subtree: true })
        setTimeout(hide, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
