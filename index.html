<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Welcome to Atenean Networking. Find work, a mentor, or a teammate. Members only, for Ateneans 18 and older. Not an official Ateneo service." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>blueLink</title>
    <script>
      try {
        var t = localStorage.getItem('bl:ui-theme')
        if (t) document.documentElement.dataset.theme = JSON.parse(t)
        // The splash matches the first screen: the dark landing, or the app in its theme.
        var signedIn = JSON.parse(localStorage.getItem('bl:token') || 'null')
        var legal = /^#\/(privacy|terms)/.test(location.hash)
        document.documentElement.dataset.splash = signedIn || legal ? document.documentElement.dataset.theme : 'void'
      } catch (e) {}
    </script>
    <style>
      #splash {
        --bg: #03050d;
        --back: #93a8ff;
        --front: #ffffff;
        --edge: #ffffff;
        --glow: rgba(58, 95, 255, 0.5);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--bg);
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0s 0.5s;
      }
      [data-splash='dark'] #splash {
        --bg: #04060f;
      }
      [data-splash='light'] #splash {
        --bg: #f4f5f9;
        --front: #1d45e5;
        --edge: #0a1540;
        --glow: rgba(29, 69, 229, 0.18);
      }
      #splash .stage {
        position: relative;
        width: 160px;
        height: 160px;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      /* A soft blue light comes up when the links connect, then breathes while the app loads. */
      #splash .stage::before {
        content: '';
        position: absolute;
        inset: -45%;
        background: radial-gradient(closest-side, var(--glow), transparent 72%);
        opacity: 0;
        animation: bl-bloom 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards, bl-breathe 2.4s ease-in-out 2s infinite;
      }
      #splash svg {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #splash.out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #splash.out .stage {
        transform: scale(1.06);
      }
      /* Every path has pathLength 100. A dash of 0 50 grows from the path start in both directions. */
      #splash path {
        fill: none;
        stroke-dasharray: 0 100 0 0;
      }
      /* 1. A white outline traces each link, starting at its far end. */
      #splash .edge {
        stroke: var(--edge);
        stroke-width: 0.3;
        animation: bl-grow 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards, bl-fade 0.45s ease 1.6s forwards;
      }
      #splash .lb .edge {
        animation-delay: 0.18s, 1.6s;
      }
      /* 2. The two links move in and lock together. */
      #splash .la {
        animation: bl-in-a 0.5s cubic-bezier(0.65, 0, 0.25, 1) 0.72s backwards;
      }
      #splash .lb {
        animation: bl-in-b 0.5s cubic-bezier(0.65, 0, 0.25, 1) 0.72s backwards;
      }
      /* 3. Color flows out from the point where they touch. */
      #splash .body {
        stroke-width: 4;
        animation: bl-grow 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }
      #splash .la .body {
        stroke: var(--back);
      }
      #splash .lb .body {
        stroke: var(--front);
      }
      #splash .ring {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: bl-ring 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }
      @keyframes bl-grow {
        to {
          stroke-dasharray: 50 0 50 0;
        }
      }
      @keyframes bl-fade {
        to {
          opacity: 0;
        }
      }
      @keyframes bl-in-a {
        from {
          transform: translate(-3.5px, -2.3px);
        }
      }
      @keyframes bl-in-b {
        from {
          transform: translate(3.5px, 2.3px);
        }
      }
      @keyframes bl-ring {
        from {
          opacity: 0.55;
          transform: scale(1);
        }
        to {
          opacity: 0;
          transform: scale(3);
        }
      }
      @keyframes bl-bloom {
        to {
          opacity: 1;
        }
      }
      @keyframes bl-breathe {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash .stage::before {
          animation: none !important;
        }
        #splash .body {
          stroke-dasharray: none;
        }
        #splash .edge,
        #splash .ring {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="stage">
        <svg viewBox="-4 -4 40 40">
          <defs>
            <clipPath id="bl-splash-clip"><circle cx="20" cy="13" r="4.2" /></clipPath>
          </defs>
          <circle class="ring" cx="16" cy="16" r="7" />
          <g class="la">
            <path class="body" pathLength="100" d="M20 13A6 6 0 0 1 14 19H9A6 6 0 0 1 3 13A6 6 0 0 1 9 7H14A6 6 0 0 1 20 13Z" />
            <path class="edge" pathLength="100" d="M1 13A8 8 0 0 1 9 5H14A8 8 0 0 1 22 13A8 8 0 0 1 14 21H9A8 8 0 0 1 1 13Z" />
            <path class="edge" pathLength="100" d="M5 13A4 4 0 0 1 9 9H14A4 4 0 0 1 18 13A4 4 0 0 1 14 17H9A4 4 0 0 1 5 13Z" />
          </g>
          <g class="lb">
            <path class="body" pathLength="100" d="M12 19A6 6 0 0 1 18 13H23A6 6 0 0 1 29 19A6 6 0 0 1 23 25H18A6 6 0 0 1 12 19Z" />
            <path class="edge" pathLength="100" d="M31 19A8 8 0 0 1 23 27H18A8 8 0 0 1 10 19A8 8 0 0 1 18 11H23A8 8 0 0 1 31 19Z" />
            <path class="edge" pathLength="100" d="M27 19A4 4 0 0 1 23 23H18A4 4 0 0 1 14 19A4 4 0 0 1 18 15H23A4 4 0 0 1 27 19Z" />
          </g>
          <!-- The back link passes over the front link at the top right. -->
          <g class="la" clip-path="url(#bl-splash-clip)">
            <path class="body" pathLength="100" d="M20 13A6 6 0 0 1 14 19H9A6 6 0 0 1 3 13A6 6 0 0 1 9 7H14A6 6 0 0 1 20 13Z" />
            <path class="edge" pathLength="100" d="M1 13A8 8 0 0 1 9 5H14A8 8 0 0 1 22 13A8 8 0 0 1 14 21H9A8 8 0 0 1 1 13Z" />
            <path class="edge" pathLength="100" d="M5 13A4 4 0 0 1 9 9H14A4 4 0 0 1 18 13A4 4 0 0 1 14 17H9A4 4 0 0 1 5 13Z" />
          </g>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Hide the splash when the first real screen is up, but not before the logo is drawn.
      ;(function () {
        var splash = document.getElementById('splash')
        var root = document.getElementById('root')
        var minMs = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1900
        var done = false
        var watch = new MutationObserver(function () {
          // The boot screen waits for the account. Its error text means it is done.
          if (root.firstElementChild && (!root.querySelector('.boot') || root.querySelector('.boot p'))) hide()
        })
        function hide() {
          if (done) return
          done = true
          watch.disconnect()
          setTimeout(function () {
            splash.classList.add('out')
            setTimeout(function () { splash.remove() }, 450)
          }, Math.max(0, minMs - performance.now()))
        }
        watch.observe(root, { childList: true, subtree: true })
        setTimeout(hide, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
