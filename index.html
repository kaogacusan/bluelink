    <style>
      /* The splash is always dark, so the white outline shows. */
      #splash {
        --bg: #03050d;
        --back: #93a8ff;
        --front: #ffffff;
        --edge: #ffffff;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: var(--bg);
        transition: background-color 0.55s cubic-bezier(0.4, 0, 0.2, 1) 0.1s;
      }
      #splash .stage {
        position: relative;
        width: 160px;
        height: 160px;
        transition: transform 0.8s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.4s ease;
      }
      #splash svg {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      /* On exit the big logo flies into the small logo on the page (set in the script below). */
      #splash.out {
        background-color: transparent;
        pointer-events: none;
      }
      #splash.out.solo .stage {
        opacity: 0;
        transform: scale(0.92);
      }
      /* Every path has pathLength 100. A dash of 0 50 grows from the path start in both directions. */
      #splash path {
        fill: none;
        stroke-dasharray: 0 100 0 0;
      }
      /* 1. A white outline traces each link, starting at its far end. */
      #splash .edge {
        stroke: var(--edge);
        stroke-width: 0.3;
        animation: bl-grow 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards, bl-fade 0.45s ease 1.5s forwards;
      }
      #splash .lb .edge {
        animation-delay: 0.18s, 1.5s;
      }
      /* 2. The two links move in and lock together. */
      #splash .la {
        animation: bl-in-a 0.5s cubic-bezier(0.65, 0, 0.25, 1) 0.72s backwards;
      }
      #splash .lb {
        animation: bl-in-b 0.5s cubic-bezier(0.65, 0, 0.25, 1) 0.72s backwards;
      }
      /* 3. Color flows out from the point where they touch. */
      #splash .body {
        stroke-width: 4;
        animation: bl-grow 0.6s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
      }
      #splash .la .body {
        stroke: var(--back);
      }
      /* The colors move to the page logo's colors as it flies in. */
      #splash .body {
        transition: stroke 0.8s ease;
      }
      #splash .lb .body {
        stroke: var(--front);
      }
      @keyframes bl-grow {
        to {
          stroke-dasharray: 50 0 50 0;
        }
      }
      @keyframes bl-fade {
        to {
          opacity: 0;
        }
      }
      @keyframes bl-in-a {
        from {
          transform: translate(-3.5px, -2.3px);
        }
      }
      @keyframes bl-in-b {
        from {
          transform: translate(3.5px, 2.3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
        #splash .body {
          stroke-dasharray: none;
        }
        #splash .edge {
          display: none;
        }
      }
    </style>

    <div id="splash" aria-hidden="true">

            <path class="edge" pathLength="100" d="M1 13A8 8 0 0 1 9 5H14A8 8 0 0 1 22 13A8 8 0 0 1 14 21H9A8 8 0 0 1 1 13Z" />
            <path class="edge" pathLength="100" d="M5 13A4 4 0 0 1 9 9H14A4 4 0 0 1 18 13A4 4 0 0 1 14 17H9A4 4 0 0 1 5 13Z" />

          </g>
          <!-- The back link passes over the front link at the top right. -->
          <g class="la" clip-path="url(#bl-splash-clip)">
            <path class="body" pathLength="100" d="M20 13A6 6 0 0 1 14 19H9A6 6 0 0 1 3 13A6 6 0 0 1 9 7H14A6 6 0 0 1 20 13Z" />
            <path class="edge" pathLength="100" d="M1 13A8 8 0 0 1 9 5H14A8 8 0 0 1 22 13A8 8 0 0 1 14 21H9A8 8 0 0 1 1 13Z" />

    <div id="root"></div>
    <noscript>
      <h1>BlueLink: Welcome to Atenean Networking</h1>
      <p>Find opportunities and network with each other. Exclusive for the Ateneo community. Made by Ateneans. Not an official Ateneo service.</p>
    </noscript>
    <script>
      // Hide the splash when the first real screen is up, but not before the logo is drawn.
      ;(function () {
        var splash = document.getElementById('splash')
        var root = document.getElementById('root')
        var calm = matchMedia('(prefers-reduced-motion: reduce)').matches
        var minMs = calm ? 0 : 1950
        var done = false
        var watch = new MutationObserver(function () {
          // The boot screen waits for the account. Its error text means it is done.
          if (root.firstElementChild && (!root.querySelector('.boot') || root.querySelector('.boot p'))) hide()
        })
        function hide() {
          if (done) return
          done = true
          watch.disconnect()
          setTimeout(leave, Math.max(0, minMs - performance.now()))
        }
        function leave() {
          var stage = splash.querySelector('.stage')
          var target = Array.prototype.find.call(root.querySelectorAll('.logo-mark'), function (el) {
            var r = el.getBoundingClientRect()
            return r.width > 0 && r.bottom > 0 && r.top < innerHeight
          })
          if (target && !calm) {
            var to = target.getBoundingClientRect()
            var from = stage.getBoundingClientRect()
            var rects = target.querySelectorAll('rect')
            // The 32 unit mark fills the middle 80% of the stage.
            var k = to.width / (from.width * 0.8)
            var dx = to.left + to.width / 2 - (from.left + from.width / 2)
            var dy = to.top + to.height / 2 - (from.top + from.height / 2)
            splash.style.setProperty('--back', getComputedStyle(rects[0]).stroke)
            splash.style.setProperty('--front', getComputedStyle(rects[1]).stroke)
            target.style.visibility = 'hidden'
            stage.style.transform = 'translate(' + dx + 'px, ' + dy + 'px) scale(' + k + ')'
          } else {
            target = null
            splash.classList.add('solo')
          }
          splash.classList.add('out')
          setTimeout(function () {
            if (target) target.style.visibility = ''
            splash.remove()
          }, 850)
        }
        watch.observe(root, { childList: true, subtree: true })
        setTimeout(hide, 8000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
