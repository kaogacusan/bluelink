<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="The private network where asking is normal. Find work, a mentor, or a teammate. Members only, for Ateneans 18 and older. Not an official Ateneo service." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>BlueLink</title>
    <script>
      try {
        var t = localStorage.getItem('bl:ui-theme')
        if (t) document.documentElement.dataset.theme = JSON.parse(t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
